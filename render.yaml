# SR Break + Stationarity bot - web service + background 1m scanner

services:
  - type: web
    name: fib-trading-bot
    runtime: python
    repo: https://github.com/didierdrin/Apex-Fund-Expert-Advisors
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn fib_sma_bot:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: DATABASE_URL
        sync: false
      - key: TIMEFRAME
        value: 1m
      - key: HTF_TIMEFRAME
        value: 15m
      - key: HTF_MINUTES
        value: 15
      - key: SCAN_INTERVAL_S
        value: 120
      - key: LOOKBACK_MINUTES
        value: 45
      - key: CORS_ORIGINS
        value: https://apex-firm.vercel.app,http://localhost:3000
      - key: PYTHONUNBUFFERED
        value: 1
