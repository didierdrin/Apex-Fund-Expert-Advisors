# render.yaml - SR Break + Stationarity bot (yfinance, 1m)

services:
  - type: cron
    name: fib-trading-bot
    runtime: python
    repo: https://github.com/didierdrin/fib-trading-bot
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python fib_sma_bot.py
    schedule: "*/3 * * * *"  # Every 3 minutes (1m strategy)
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: BOT_RUN_ONCE
        value: true
      - key: TIMEFRAME
        value: 1m
      - key: HTF_TIMEFRAME
        value: 15m
      - key: SCAN_INTERVAL_S
        value: 60
      - key: PYTHONUNBUFFERED
        value: 1
