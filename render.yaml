# Fib SMA bot (matches fib_sma.pine) - web service + background scanner
#
# NOTE: TIMEFRAME=1m below is a deliberately fast base timeframe for quickly
# verifying marks fire in production. HTF stays 4h/240min (Pine's actual
# default) — fib_sma_bot.py fetches HTF bars independently of the base
# timeframe's fetch, so this is safe even at TIMEFRAME=1m.

services:
  - type: web
    name: fib-trading-bot
    runtime: python
    repo: https://github.com/didierdrin/Apex-Fund-Expert-Advisors
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn fib_sma_bot:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: PYTHONUNBUFFERED
        value: 1
      - key: DATABASE_URL
        sync: false

      # Timeframes (Pine: chart timeframe + fixed 4H HTF)
      - key: TIMEFRAME
        value: 1m
      - key: BAR_MINUTES
        value: 1
      - key: HTF_TIMEFRAME
        value: 4h
      - key: HTF_MINUTES
        value: 240

      # Fib + SMA (match fib_sma.pine inputs)
      - key: FIB_LEVEL
        value: 0.618
      - key: FIB_LENGTH
        value: 50
      - key: SMA_FAST
        value: 50
      - key: SMA_SLOW
        value: 200

      # How many closed bars to scan for missed marks
      - key: LOOKBACK_BARS
        value: 2000

      # Scanner timing
      - key: SCAN_INTERVAL_S
        value: 60
      - key: SYMBOL_SLEEP_S
        value: 0.35
      - key: CACHE_TTL_S
        value: 55

      # CORS
      - key: CORS_ORIGINS
        value: https://apex-firm.vercel.app,http://localhost:3000
